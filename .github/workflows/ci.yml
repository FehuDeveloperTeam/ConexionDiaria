# Integración continua — Sprint 11.2.
#
# Existían 159 pruebas y no las corría nadie más que quien se acordara. Nada
# impedía subir código que las rompiera, y el proyecto ya tiene una línea base
# frágil que solo se sostenía a mano: tsc sin errores, lint en exactamente 3
# avisos, el export de web generando sus rutas, y las cinco suites en verde.
#
# Esto lo vuelve mecánico. No reemplaza la revisión: evita que una regresión
# llegue al teléfono de alguien por olvido.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Una tanda por rama: si se suben dos commits seguidos, solo interesa el
# último y cancelar el anterior ahorra minutos.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (tipos, lint, lógica, export)
    runs-on: ubuntu-latest
    env:
      # Valores de relleno. El export solo necesita que las variables
      # EXISTAN para inlinearlas en el bundle; con esto se comprueba que el
      # build no está roto, sin exponer las credenciales reales en CI.
      EXPO_PUBLIC_FIREBASE_API_KEY: ci-placeholder
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
      EXPO_PUBLIC_FIREBASE_APP_ID: '1:000000000000:web:0000000000000000000000'
      EXPO_PUBLIC_REVENUECAT_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Tipos
        run: npm run typecheck

      # El tope de 3 es la línea base conocida del proyecto: dos avisos de
      # dependencias en animaciones de onda y uno en el pulso del corazón de
      # Inicio, los tres revisados y aceptados. Fijarlo acá convierte "no
      # agregar avisos nuevos" en algo que el CI hace cumplir, en vez de una
      # costumbre. Cuando se arregle alguno, hay que bajar el número.
      - name: Lint (máximo 3 avisos, la línea base)
        run: npm run lint -- --max-warnings 3

      - name: Pruebas de lógica (precios, hitos, preguntas, recuerdos)
        run: npm run test:logic

      - name: Export de web
        run: npx expo export --platform web

  rules:
    name: Reglas de Firestore y Storage (emuladores)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Los emuladores de Firebase corren sobre la JVM. Se fija la versión
      # en vez de confiar en la que traiga la imagen del runner.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: npm ci

      - name: Pruebas de reglas
        run: npm run test:rules

  functions:
    name: Cloud Functions (tipos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci
        working-directory: functions

      - name: Tipos
        run: npx tsc --noEmit -p .
        working-directory: functions
